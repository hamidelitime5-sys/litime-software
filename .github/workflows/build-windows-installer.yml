name: "Build Windows 11 Tauri Desktop App"

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri Desktop Application for Windows 11
        uses: tauri-apps/tauri-action@v0
        with:
          args: "--runner npm"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
